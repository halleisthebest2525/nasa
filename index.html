
<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080a0c">
  <title>Starfall — Deep Space</title>
  <link rel="stylesheet" href="./styles/main.css">
</head>
<body>
  <main id="game">
    <canvas id="space"></canvas>

    <header class="topbar">
      <div class="brand">
        <span class="brand-mark">✦</span>
        <div>
          <strong>STARFALL</strong>
          <small>DEEP SPACE EXPLORATION</small>
        </div>
      </div>

      <div class="status">
        <span class="status-dot"></span>
        SYSTEM ONLINE
      </div>
    </header>

    <section class="hud-left panel">
      <div class="eyebrow">SHIP STATUS</div>

      <div class="ship-name">
        WAYFARER <span>MK. I</span>
      </div>

      <div class="stat-row">
        <span>ENGINE RPM</span>
        <strong id="speed">0</strong>
        <small>RPM</small>
      </div>

      <div class="meter">
        <i id="speed-meter"></i>
      </div>

      <div class="stat-row">
        <span>HULL</span>
        <strong id="hull-value">100</strong>
        <small>%</small>
      </div>

      <div class="meter hull">
        <i id="hull-meter"></i>
      </div>
    </section>

    <section class="hud-right panel">
      <div class="eyebrow">ENVIRONMENT</div>

      <div class="environment-title">
        DEEP SPACE
      </div>

      <div class="environment-info">
        <span class="mission-dot"></span>
        <div>
          <b>SECTOR 01</b>
          <small>Uncharted region</small>
        </div>
      </div>

      <div class="environment-info">
        <span class="warning-dot"></span>
        <div>
          <b>ASTEROID FIELD</b>
          <small>Debris detected</small>
        </div>
      </div>
    </section>

    <footer class="bottom-bar">
      <div class="controls">
        <span><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> MOVE</span>
        <span><kbd>SHIFT</kbd> BOOST</span>
        <span><kbd>SPACE</kbd> BRAKE</span>
        <span><kbd>M</kbd> MAP</span>
        <span><kbd>E</kbd> EXIT / INTERACT</span>
      </div>

      <div class="coords" id="coords">
        SECTOR 01 · X 0000 · Y 0000
      </div>
    </footer>
  </main>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
